# Free runner. Each run loops one cycle every 10 minutes while the market
# is open and sleeps until just before the next open when it's closed
# (scheduler.run_session, stay_on), handing over to a new run near the
# job limit. So ANY trigger keeps the bot running from then on, across
# nights and weekends. GitHub's own schedule has proved sparse (about two
# runs a day); it and a 9:15 AM ET Claude routine (see README) only
# restart the chain if it ever breaks.
# Repo secrets: APCA_API_KEY_ID, APCA_API_SECRET_KEY (PK paper only) from a
# paper account used ONLY by this bot (not the ALBOT allocator account).
#
# Cron is in UTC and does not shift for US DST: 12-21 UTC covers the
# session in both EDT and EST. Extra triggers while a run is looping just
# queue behind it (concurrency group; a newer pending run replaces an
# older one), so there is only ever one chain. If every run somehow
# misses the flatten, the GTC stop/target legs still protect the
# position overnight.
name: daytrader
on:
  schedule:
    # Minute 3,13,23,... rather than :00/:10: GitHub drops scheduled runs
    # most often in the congested top-of-hour slots. The flatten still runs
    # by ~15:33, well before the close.
    - cron: "3-59/10 12-21 * * 1-5"
  workflow_dispatch:
# One cycle at a time: a manual run overlapping a scheduled one could
# otherwise both see no position and both buy.
concurrency:
  group: daytrader
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    # GitHub's limit is 360 min; the loop hands over well before that.
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write   # lets the loop start its own follow-up run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore halt state
        uses: actions/cache@v4
        with:
          path: halt_state.json
          key: halt-state-${{ github.run_id }}
          restore-keys: |
            halt-state-
      - name: run session
        id: loop
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TZ: America/New_York
        run: |
          python3 - <<'PY'
          import os
          import scheduler
          chain = scheduler.run_session(budget_minutes=330, stay_on=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"chain={'true' if chain else 'false'}\n")
          print("done", scheduler.hhmm(), "chain" if chain else "session over")
          PY
      - name: save halt state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: halt_state.json
          key: halt-state-${{ github.run_id }}
      # Budget spent mid-session: start the next run. GITHUB_TOKEN may
      # trigger workflow_dispatch (unlike other events), and the
      # concurrency group starts it as soon as this run ends.
      - name: hand over to a new run
        if: steps.loop.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daytrader.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
