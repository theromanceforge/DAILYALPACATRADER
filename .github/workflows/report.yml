# End-of-day report: one comment per trading day on the `daily-report`
# issue. Read-only on Alpaca.
#
# 21:37 UTC is after the close year-round: 5:37 PM EDT / 4:37 PM EST
# (off the congested :00/:30 slots, where GitHub drops scheduled runs).
# report.py skips holidays using Alpaca's calendar. Run manually with a
# date to (re)post a past day.
name: report
on:
  schedule:
    - cron: "37 21 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading day YYYY-MM-DD (blank = today)"
        required: false
        default: ""
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: report
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/New_York
          REPORT_DATE: ${{ inputs.date }}
        run: python3 report.py "$REPORT_DATE"
